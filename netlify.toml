
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/auth/steam/*"
  to = "https://gwmygthanyycveyqqspr.supabase.co/functions/v1/steam-auth/:splat"
  status = 200
  force = true
  headers = { "X-Steam-Auth-Source" = "netlify" }

[[redirects]]
  from = "/api/webhooks/stripe"
  to = "https://gwmygthanyycveyqqspr.supabase.co/functions/v1/handle-stripe-donation"
  status = 200
  force = true

# Auth-related routes need to be handled explicitly
[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/login-error"
  to = "/index.html"
  status = 200
  force = false

# Auth route fallback - handle post-authentication redirects  
[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200
  force = false

# Handle all routes by serving the main app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
