
# Ensure API redirects are handled before catch-all rewrites
[[redirects]]
from = "/api/auth/steam/*"
to = "https://gwmygthanyycveyqqspr.supabase.co/functions/v1/steam-auth/:splat"
status = 200
force = true
headers = { "X-Steam-Auth-Source" = "netlify" }

[[redirects]]
from = "/api/upsert-user"
to = "https://gwmygthanyycveyqqspr.supabase.co/functions/v1/upsert-user"
status = 200
force = true

[[redirects]]
from = "/api/webhooks/stripe"
to = "https://gwmygthanyycveyqqspr.supabase.co/functions/v1/handle-stripe-donation"
status = 200
force = true

[build]
command = "npm run build"
publish = "dist"

# Custom cache control for auth-related routes
[[headers]]
  for = "/auth/*"
  [headers.values]
    Cache-Control = "no-store"
    Pragma = "no-cache"

# Auth-related routes need explicit handling to prevent race conditions
[[redirects]]
from = "/auth/callback"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/auth/steam-callback"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/welcome"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/auth"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/login-error"
to = "/index.html"
status = 200
force = true

# Admin routes
[[redirects]]
from = "/admin/*"
to = "/index.html"
status = 200
force = false

# Auth route fallback - handle post-authentication redirects  
[[redirects]]
from = "/auth/*"
to = "/index.html"
status = 200
force = true

# Catch-all fallback for all remaining routes
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false
